name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
permissions:
  contents: read
# Metadata-only edits must not cancel a running validation of the same PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name == 'pull_request' && github.event.action == 'edited' && !github.event.changes.base && 'metadata' || 'code' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  offline-tests:
    if: github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install Lua and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y lua5.4
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Rust unit tests (fake plugin only)
        working-directory: service
        run: cargo test --locked
      - name: Lua console mock tests
        run: lua5.4 tools/ma3/test/surface_plugin_test.lua
